[project]
name = "fresh-stock"
version = "0.1.0"
description = "AI agent for fresh produce stores: handwritten inventory sheets to daily orders."
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
]

[project.scripts]
fresh-stock = "fresh_stock.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
