[project]
name = "fresh-stock"
version = "0.1.0"
description = "AI agent for fresh produce stores: handwritten inventory sheets to daily orders."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "holidays>=0.105",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
fresh-stock = "fresh_stock.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
