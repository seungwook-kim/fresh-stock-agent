name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"       # 시험은 키 없이 돈다(LLM 호출 시험은 건너뜀)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: 시험 (pytest)
        run: uv run --frozen pytest -q
